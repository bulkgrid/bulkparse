[build-system]
requires = ["maturin>=1.11.5,<2.0"]
build-backend = "maturin"

[project]
name = "bulkparse"
dynamic = ["version"]
description = "Python bindings for the BulkParse Rust document engine"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
readme = "README.md"

[project.urls]
Repository = "https://github.com/bulkgrid/bulkparse"

[tool.maturin]
module-name = "bulkparse._native"
python-source = "python"
