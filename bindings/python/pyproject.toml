[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "bulkparse"
dynamic = ["version"]
description = "Python bindings for the BulkParse Rust document engine"
requires-python = ">=3.10"
license = "MIT"

[tool.maturin]
module-name = "bulkparse._native"
python-source = "python"
