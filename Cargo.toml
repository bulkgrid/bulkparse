[workspace]
members = ["crates/bulkparse", "crates/bulkparse-cli", "crates/bulkparse-pool", "crates/bulkparse-ocr", "crates/bulkparse-ocr-native", "bindings/node", "bindings/python", "bindings/wasm"]
default-members = ["crates/bulkparse", "crates/bulkparse-cli"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/bulkgrid/bulkparse"

[workspace.dependencies]
bulkparse = { path = "crates/bulkparse", version = "0.1.1", default-features = false }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
strip = "symbols"

# wasm-bindgen needs the target_features custom section during glue generation.
[profile.release.package.bulkparse-wasm]
strip = "debuginfo"
