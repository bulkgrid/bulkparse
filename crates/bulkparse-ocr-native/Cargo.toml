[package]
name = "bulkparse-ocr-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native OCR, scanned table extraction and PDF rendering for BulkParse"

[dependencies]
bulkparse = { workspace = true, features = ["pdf"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff"] }
oar-ocr = { version = "=0.9.1", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
firecrawl-pdfium = "=0.1.0"
tiff = "0.11.3"
quick-xml = "0.41"
