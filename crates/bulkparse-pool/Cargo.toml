[package]
name = "bulkparse-pool"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional bounded process host for BulkParse"

[dependencies]
bulkparse = { workspace = true, features = ["docx", "pdf", "office"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3"

[dev-dependencies]
sha2 = "0.10"

[[bin]]
name = "bulkparse-worker"
path = "src/bin/worker.rs"
