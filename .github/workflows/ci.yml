name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo check --workspace
      - run: cargo test -p bulkparse
      - run: cargo test -p bulkparse --no-default-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test -p bulkparse-pool
      - run: cargo test -p bulkparse-ocr
      - run: python3 -m pip install -r benchmarks/requirements-test.txt
      - run: python3 scripts/run_harness_tests.py
  ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backends/rapidocr/requirements.txt
      - run: python backends/rapidocr/configure.py --output target/ocr/settings
      - run: cargo build --locked --release -p bulkparse-cli --features ocr
      - run: python scripts/evaluate_ocr.py --binary "$PWD/target/release/bulkparse" --config "$PWD/target/ocr/settings/config.json" --out reports/ocr-ci
      - run: python scripts/check_ocr_results.py reports/ocr-ci
  node:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
        working-directory: bindings/node
      - run: npm test
        working-directory: bindings/node
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install maturin
      - run: maturin build --release --out dist
        working-directory: bindings/python
      - run: python -m pip install bindings/python/dist/*.whl
      - run: python -m unittest discover -s bindings/python/tests
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-pack --locked
      - run: npm run build
        working-directory: bindings/wasm
      - run: node bindings/wasm/test/smoke.mjs
      - run: npm run test:package
        working-directory: bindings/wasm
