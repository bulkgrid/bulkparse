[package]
name = "bulkparse-opendataloader-bench"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
bulkparse = { path = "../../crates/bulkparse", default-features = false, features = ["pdf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
